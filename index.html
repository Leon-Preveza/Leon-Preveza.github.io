<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leon Preveza – Hier entsteht die Internetpräsenz</title>
<meta name="description" content="Hier entsteht die Internetpräsenz von Leon Preveza: Bücher, die KI für Einsteiger verständlich machen.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%23c8782f'/%3E%3C/svg%3E">
<style>
  :root {
    --sky: #f2f4f2;
    --sea: #2b5d80;
    --sea-deep: #1d4563;
    --ink: #17283a;
    --ink-soft: #4a5b6b;
    --sun: #c8782f;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --sky: #0f1d2b;
      --sea: #173a55;
      --sea-deep: #0c2638;
      --ink: #ece6d8;
      --ink-soft: #a9b4be;
      --sun: #e39a52;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    background: var(--sky);
    color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px);
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    width: 100%;
    max-width: 44rem;
    margin: 0 auto;
    padding: 3rem 1.75rem 2rem;
  }

  .sun {
    width: 1.1rem;
    height: 1.1rem;
    border-radius: 50%;
    background: var(--sun);
    margin-bottom: 2rem;
  }

  h1 {
    font-size: clamp(2.1rem, 7vw, 3.6rem);
    line-height: 1.12;
    font-weight: 500;
    letter-spacing: -0.01em;
    margin: 0 0 1.5rem;
  }

  p {
    font-size: clamp(1.05rem, 3.2vw, 1.25rem);
    line-height: 1.6;
    color: var(--ink-soft);
    margin: 0;
    max-width: 34rem;
  }

  .sea {
    height: 28vh;
    min-height: 9rem;
    background: linear-gradient(to bottom, var(--sea), var(--sea-deep));
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
</style>
</head>
<body>
  <main>
    <div class="sun" aria-hidden="true"></div>
    <h1>Hier entsteht die Internetpräsenz von Leon&nbsp;Preveza.</h1>
    <p>Bald findest du hier meine Bücher über KI für Einsteiger und alles, was dazugehört.</p>
  </main>
  <div class="sea" aria-hidden="true"></div>
</body>
</html>
